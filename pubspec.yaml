name: shopsphere
description: A modern Flutter shopping app (DummyJSON API) with login, cart, checkout, fake bKash/card/bank payment, CRUD, Hive offline cache and pagination.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3+1
  provider: ^6.1.2
  get_it: ^7.6.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
